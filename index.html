<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tlou Family Tree</title>
<style>
:root{
  --bg:#f6f2ec; --card:#fff; --ink:#2a2420; --muted:#786e66; --line:#cbbfb3; --soft:#efe7dd;
  --f:#fdebf2; --f-b:#e6a3bf; --f-av:#cf6d97;
  --m:#e8eefd; --m-b:#97a9e6; --m-av:#5a74cc;
  --u:#f3f0ec; --u-b:#cbbfb3; --u-av:#9d918a;
  --accent:#9a4b2b; --accent-ink:#fff; --hl:#f0ad2e; --edit:#fff3d1; --danger:#b3261e;
  --radius:14px; --shadow:0 6px 22px rgba(60,40,20,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid #dacfc3;background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;line-height:1.1}
button:hover{background:#f6f0e9}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--danger);border-color:#e7b9b5}
button.danger:hover{background:#fdf0ef}
button.ghost{border-color:transparent;background:transparent}
[hidden]{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:1px solid #e9e0d5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.brand h1{margin:0;font-size:1.25rem;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:460px;margin-left:auto}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border:1px solid #dacfc3;border-radius:999px;font:inherit;background:#faf7f3}
.search-wrap input:focus{outline:2px solid var(--accent);background:#fff}
.search-wrap::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.6}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid #dacfc3;border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:50}
#results div{padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
#results div:hover,#results div.act{background:#f6f0e9}
#results small{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid #dacfc3;border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--soft);font-weight:600}

/* bars */
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 18px;background:var(--edit);border-bottom:1px solid #eedb9f;font-size:.9rem}
.editbar .msg{margin-right:auto}
.notice{padding:9px 18px;background:#eef6ee;border-bottom:1px solid #cfe3cf;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice span{margin-right:auto}

/* main */
main{flex:1;display:flex;min-height:0}
.view{flex:1;position:relative;min-width:0}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#viewport.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;padding:40px}
.floating{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.floating button{box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:44px}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid #e9e0d5;border-radius:10px;padding:7px 10px;font-size:.75rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;z-index:5}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* tree */
.tree ul{display:flex;justify-content:center;padding:26px 0 0;margin:0;position:relative;list-style:none}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:26px 7px 0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{border-top:none}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 10px 0 0}
.tree li:first-child::after{border-radius:10px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:26px;border-left:2px solid var(--line)}
.tree>ul{padding-top:0}
.tree>ul>li{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.couple{display:flex;align-items:center;position:relative}
.couple .ring{width:16px;text-align:center;color:var(--line);font-size:.8rem}
.p{width:124px;min-height:84px;padding:9px 8px 8px;border-radius:var(--radius);border:2px solid var(--u-b);background:var(--u);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;user-select:none;position:relative;transition:transform .12s, box-shadow .12s}
.p:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.p.f{background:var(--f);border-color:var(--f-b)} .p.m{background:var(--m);border-color:var(--m-b)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:700;background:var(--u-av);flex:none}
.f>.av,.av.f{background:var(--f-av)} .m>.av,.av.m{background:var(--m-av)}
.p .nm{font-size:.82rem;line-height:1.15;font-weight:600}
.p .yr{font-size:.7rem;color:var(--muted)}
.p.late{filter:saturate(.55)}
.p.late .nm{color:#6d645d}
.p .badge{position:absolute;top:6px;right:8px;font-size:.7rem;color:#9b918a}
.p.sel{outline:3px solid var(--accent);outline-offset:3px}
.p.path{box-shadow:0 0 0 4px var(--hl)}
.p.hit{animation:pulse 1.1s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(240,173,46,.55)}}
.tog{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;padding:0;font-size:.85rem;font-weight:700;z-index:2;background:#fff;display:grid;place-items:center}
li.collapsed>ul{display:none}
.count{font-size:.7rem;color:var(--muted);margin-top:16px;white-space:nowrap}
.qadd{display:none}
body.editing .qadd{display:grid;position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:0;border-radius:50%;place-items:center;background:var(--accent);color:#fff;border:2px solid #fff;font-weight:700;font-size:.85rem;z-index:3}

/* list view */
#listView{overflow:auto}
.listwrap{max-width:860px;margin:0 auto;padding:18px 18px 120px}
.listtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.outline details{margin-left:22px;border-left:2px solid var(--soft);padding-left:10px}
.outline>details{margin-left:0;border-left:0;padding-left:0}
.outline summary{list-style:none;cursor:pointer;padding:6px 4px;border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.outline summary::-webkit-details-marker{display:none}
.outline summary::before{content:"▸";color:var(--muted);width:12px;transition:transform .15s;display:inline-block}
.outline details[open]>summary::before{transform:rotate(90deg)}
.outline .leaf{margin-left:22px;padding:6px 4px 6px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-left:2px solid var(--soft)}
.outline summary:hover,.outline .leaf:hover{background:#fff}
.nmchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.nmchip .av{width:24px;height:24px;font-size:.62rem}
.nmchip:hover{text-decoration:underline}
.nmchip.late{color:#7c736c;font-weight:500}
.outline .sp{color:var(--muted);font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.outline .cnt{font-size:.78rem;color:var(--muted)}
.outline .yr{font-size:.78rem;color:var(--muted)}

/* side panel */
aside{width:370px;flex:none;background:#fff;border-left:1px solid #e9e0d5;overflow:auto;padding:18px 20px 40px}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.av.big{width:58px;height:58px;font-size:1.25rem}
.prof h2{margin:0;font-size:1.3rem;line-height:1.2}
.prof .sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.nav button{padding:6px 10px;font-size:.85rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--edit);border:1px solid #eedb9f;border-radius:12px;padding:10px;margin:12px 0}
.acts .full{grid-column:1/-1}
.acts .hint{grid-column:1/-1;font-size:.78rem;color:#7a6326;margin:0}
aside h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:18px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--u-b);background:var(--u);cursor:pointer}
.chip .av{width:22px;height:22px;font-size:.58rem}
.chip.f{background:var(--f);border-color:var(--f-b)} .chip.m{background:var(--m);border-color:var(--m-b)}
.chip.late{color:#6d645d}
.chip:hover{filter:brightness(.97)}
.none{font-size:.85rem;color:var(--muted)}
.notes{background:#faf7f3;border-radius:10px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap;margin-top:10px}
.lineage{font-size:.84rem;line-height:1.8}
.lineage a,.crumbs a{color:var(--accent);cursor:pointer}
.rel{background:#faf5ee;border:1px solid #eadfce;border-radius:12px;padding:12px;margin-top:18px}
.rel select{width:100%;padding:9px;border-radius:10px;border:1px solid #dacfc3;font:inherit;margin:8px 0;background:#fff}
.answer{font-size:.95rem;line-height:1.45}
.answer b{color:var(--accent)}
.crumbs{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.7}
.welcome h2{margin-top:0}
.welcome p,.welcome li{font-size:.92rem;line-height:1.5;color:#4d453f}
.welcome ul{padding-left:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:#faf5ee;border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.3rem;color:var(--accent)}
.stats span{font-size:.72rem;color:var(--muted)}
.handle{display:none}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(40,30,20,.45)}
dialog form{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:1.15rem}
dialog .lead{margin:-4px 0 0;color:var(--muted);font-size:.88rem}
dialog label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600}
dialog label>input,dialog textarea{width:100%;min-width:0;font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid #dacfc3}
dialog input:focus,dialog textarea:focus{outline:2px solid var(--accent)}
dialog fieldset{border:0;padding:0;margin:0}
dialog legend{font-size:.88rem;font-weight:600;margin-bottom:6px}
.pick{display:flex;gap:8px}
.pick label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:1px solid #dacfc3;border-radius:10px;padding:9px;font-weight:500;cursor:pointer}
.pick input{margin:0}
.pick label:has(input:checked){border-color:var(--accent);background:#fbf3ec;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chk input{width:auto!important;flex:none}
.chk{flex-direction:row!important;justify-content:flex-start;align-items:center;gap:8px!important;font-weight:500!important}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.col{display:flex;flex-direction:column;gap:8px}
.col button{text-align:left;padding:11px 14px}
.steps{margin:0;padding-left:20px;font-size:.9rem;line-height:1.6}
.help h4{margin:10px 0 2px}
.help p,.help li{font-size:.9rem;line-height:1.5;margin:4px 0}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(200%);opacity:0;visibility:hidden;background:#2a2420;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:100;transition:transform .25s;box-shadow:var(--shadow);font-size:.9rem;max-width:calc(100vw - 24px)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#toast button{background:transparent;color:#ffd48a;border-color:#6a5d52;padding:5px 10px}

@media (max-width: 820px){
  .top{padding:8px 10px;gap:8px;flex-wrap:wrap}
  .brand{flex:1}
  .brand h1{font-size:1.02rem;white-space:nowrap}
  .brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.72rem}
  .brand>div:last-child{min-width:0}
  .logo{width:32px;height:32px;font-size:16px;border-radius:9px}
  .search-wrap{order:3;flex-basis:100%;max-width:none;margin:0}
  .search-wrap input{padding:8px 12px 8px 34px}
  .actions{gap:6px}
  .actions button{padding:7px 9px}
  .actions .lbl{display:none}
  #toast{bottom:auto;top:12px}
  .editbar{padding:8px 12px}
  .editbar .msg{flex-basis:100%}
  .legend{display:none}
  .floating{bottom:auto;top:8px;right:8px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:5px}
  .floating button{min-width:36px;padding:6px 8px;font-size:.8rem}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:46dvh;border-left:0;border-radius:18px 18px 0 0;
        box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:40;padding:6px 16px calc(24px + env(safe-area-inset-bottom));transition:max-height .2s}
  aside.min{max-height:96px;overflow:hidden}
  .handle{display:block;width:100%;border:0;background:transparent;padding:6px 0 10px}
  .handle::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#d6ccc1;margin:0 auto}
  .listwrap{padding-bottom:60dvh}
}
@media print{
  body{height:auto;overflow:visible;display:block}
  .top .actions,.search-wrap,.editbar,.notice,aside,.listtools,#treeView,#toast{display:none!important}
  #listView{display:block!important;overflow:visible}
  .outline details{border-left:1px solid #ccc}
  .outline summary::before{content:""}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">🌳</div>
    <div><h1 id="title">Tlou Family Tree</h1><p id="subtitle"></p></div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Find a family member…" autocomplete="off" aria-label="Search">
    <div id="results" hidden></div>
  </div>
  <div class="actions">
    <div class="seg" role="tablist">
      <button id="vTree" class="on" title="Tree view">🌳<span class="lbl"> Tree</span></button>
      <button id="vList" title="List view">☰<span class="lbl"> List</span></button>
    </div>
    <button id="editBtn" class="primary">✎<span class="lbl"> Edit family</span></button>
    <button id="helpBtn" title="Help">?</button>
  </div>
</header>

<div id="editbar" class="editbar" hidden>
  <span class="msg"><b>Editing mode.</b> Click a person, then use the yellow buttons in the side panel. Your changes are saved on this device.</span>
  <button id="undoBtn" disabled>↶ Undo</button>
  <button id="downloadBtn" class="primary">⬇ Download updated website</button>
  <button id="moreBtn">More…</button>
  <button id="doneBtn">✓ Done</button>
</div>
<div id="notice" class="notice" hidden></div>

<main>
  <section id="treeView" class="view">
    <div id="viewport"><div id="canvas" class="tree"></div></div>
    <div class="floating">
      <button id="zin" title="Zoom in">＋</button>
      <button id="zout" title="Zoom out">－</button>
      <button id="fit" title="Show whole tree">⤢</button>
      <button id="expand" title="Open all branches">Open all</button>
      <button id="collapse" title="Fold branches">Fold</button>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--f-av)"></i>Female</span>
      <span><i class="sw" style="background:var(--m-av)"></i>Male</span>
      <span><i class="sw" style="background:var(--u-av)"></i>Not recorded</span>
      <span>✝ Late</span>
      <span>Drag to move · scroll / pinch to zoom</span>
    </div>
  </section>
  <section id="listView" class="view" hidden>
    <div class="listwrap">
      <div class="listtools">
        <button id="openAll">Open all</button>
        <button id="closeAll">Close all</button>
        <button id="printBtn">🖨 Print list</button>
      </div>
      <div id="outline" class="outline"></div>
    </div>
  </section>
  <aside id="panel"></aside>
</main>

<dialog id="formDlg">
  <form id="form" method="dialog">
    <h3 id="formTitle">Add a person</h3>
    <p class="lead" id="formLead"></p>
    <label>Full name <input name="name" required placeholder="e.g. Thabo Tlou" autocomplete="off"></label>
    <fieldset><legend>Gender</legend>
      <div class="pick">
        <label><input type="radio" name="g" value="f"> Female</label>
        <label><input type="radio" name="g" value="m"> Male</label>
        <label><input type="radio" name="g" value="u"> Not sure</label>
      </div>
    </fieldset>
    <div class="two">
      <label>Year born <input name="born" inputmode="numeric" placeholder="optional"></label>
      <label>Year passed <input name="died" inputmode="numeric" placeholder="optional"></label>
    </div>
    <label class="chk"><input type="checkbox" name="late"> This person has passed away</label>
    <label>Notes <textarea name="notes" rows="3" placeholder="Optional: nickname, clan name, where they live…"></textarea></label>
    <div class="row">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="msgDlg">
  <form method="dialog">
    <h3 id="msgTitle"></h3>
    <div id="msgBody"></div>
    <div id="msgBtns" class="row"></div>
  </form>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------------- data & storage ----------------
const DATA_EL = document.getElementById('family-data');
const ORIGINAL_STR = JSON.stringify(JSON.parse(DATA_EL.textContent));
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const KEY = 'family-tree:' + location.pathname;
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };
const BASE = hash(ORIGINAL_STR);
let data = JSON.parse(ORIGINAL_STR);
let staleSaved = null;
function readSaved(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ base: BASE, data, savedAt: Date.now() })); } catch(e){} }
function clearSaved(){ try { localStorage.removeItem(KEY); } catch(e){} }
(function loadSaved(){
  const s = readSaved();
  if (!s || !s.data) return;
  if (JSON.stringify(s.data) === ORIGINAL_STR) { clearSaved(); return; }
  if (s.base === BASE) data = s.data; else staleSaved = s;
})();
const hasLocalChanges = () => JSON.stringify(data) !== ORIGINAL_STR;

// ---------------- index ----------------
let people = [], byId = {}, root, nameCount = {};
function build(){
  people = []; byId = {};
  function mk(o, id, gen, extra){
    const p = Object.assign({ id, o, name: o.name || '(no name)', g: o.g || 'u', late: !!(o.late || o.died), gen, children: [] }, extra);
    people.push(p); byId[id] = p; return p;
  }
  function add(o, parent, gen, id){
    const p = mk(o, id, gen, { parent, blood: true });
    if (o.spouse) p.partner = mk(o.spouse, id + 's', gen, { parent: null, blood: false, partnerOf: p });
    (o.children || []).forEach((c, i) => p.children.push(add(c, p, gen + 1, id + '.' + (i + 1))));
    return p;
  }
  root = add(data, null, 1, '1');
  people.forEach(p => { if (!p.blood) p.children = p.partnerOf.children; });
  nameCount = {}; people.forEach(p => nameCount[p.name] = (nameCount[p.name] || 0) + 1);
}
const anchor = p => p.blood ? p : p.partnerOf;
const partnerOf = p => p.blood ? p.partner : p.partnerOf;
const parentsOf = p => (!p.blood || !p.parent) ? [] : [p.parent, p.parent.partner].filter(Boolean);
const siblingsOf = p => (p.blood && p.parent) ? p.parent.children.filter(c => c !== p) : [];
const descendants = p => p.children.reduce((n, c) => n + 1 + descendants(c), 0);
const first = n => String(n).replace(/\s+Tlou$/, '');
function initials(n){ const w = String(n).trim().split(/\s+/).filter(Boolean); return ((w[0]||'?')[0] + (w.length > 1 ? w[w.length-1][0] : '')).toUpperCase(); }
function years(o){ if (o.born && o.died) return o.born + ' – ' + o.died; if (o.born) return 'Born ' + o.born; if (o.died) return 'Passed ' + o.died; return ''; }
function hint(p){
  if (!p.blood) return 'partner of ' + p.partnerOf.name;
  if (p.parent) return (p.g === 'f' ? 'daughter' : p.g === 'm' ? 'son' : 'child') + ' of ' + first(p.parent.name);
  return 'eldest ancestor';
}
const label = p => nameCount[p.name] > 1 ? `${p.name} (${hint(p)})` : p.name;
const av = p => `<span class="av ${p.g}">${esc(initials(p.name))}</span>`;

// ---------------- state ----------------
let current = null, selObj = null, selId = null, visited = [], compareWith = null;
let editMode = false, view = 'tree';
const undoStack = [];
const collapsed = new Set();
function defaultFold(){ collapsed.clear(); people.forEach(p => { if (p.blood && p.gen >= 3 && p.children.length) collapsed.add(p.o); }); }

// ---------------- tree render ----------------
const canvas = $('#canvas'), vp = $('#viewport');
function card(p){
  const d = document.createElement('div');
  d.className = `p ${p.g}${p.late ? ' late' : ''}`;
  d.dataset.id = p.id;
  d.title = label(p) + (p.late ? ' (late)' : '');
  const y = years(p.o);
  d.innerHTML = `${av(p)}<div class="nm">${esc(p.name)}</div>${y ? `<div class="yr">${esc(y)}</div>` : ''}${p.late ? '<span class="badge">✝</span>' : ''}` +
    `<button class="qadd" data-qadd="${p.id}" title="Add a child">＋</button>`;
  p.el = d;
  return d;
}
function renderLi(p){
  const li = document.createElement('li'); p.li = li;
  const c = document.createElement('div'); c.className = 'couple';
  c.appendChild(card(p));
  if (p.partner){ const r = document.createElement('span'); r.className = 'ring'; r.textContent = '⚭'; c.appendChild(r); c.appendChild(card(p.partner)); }
  li.appendChild(c);
  if (p.children.length){
    const isC = collapsed.has(p.o);
    const t = document.createElement('button'); t.className = 'tog'; t.dataset.tog = p.id; t.textContent = isC ? '+' : '−'; t.title = isC ? 'Show children' : 'Hide children';
    c.appendChild(t);
    if (isC){ li.classList.add('collapsed'); const n = descendants(p); const k = document.createElement('div'); k.className = 'count'; k.textContent = `${n} ${n === 1 ? 'descendant' : 'descendants'} folded`; li.appendChild(k); }
    const ul = document.createElement('ul');
    p.children.forEach(ch => ul.appendChild(renderLi(ch)));
    li.appendChild(ul);
  }
  return li;
}
function renderTree(){
  canvas.innerHTML = '';
  const ul = document.createElement('ul'); ul.appendChild(renderLi(root)); canvas.appendChild(ul);
  markSelection();
}
function markSelection(){
  document.querySelectorAll('.p.sel,.p.path').forEach(e => e.classList.remove('sel', 'path'));
  if (current && current.el) current.el.classList.add('sel');
  if (current && compareWith) relationship(current, compareWith).path.forEach(x => x.el && x.el.classList.add('path'));
}
function setFold(p, v){ if (!p.children.length) return; v ? collapsed.add(p.o) : collapsed.delete(p.o); }
function revealPath(p){ let changed = false; for (let a = anchor(p).parent; a; a = a.parent) if (collapsed.has(a.o)) { collapsed.delete(a.o); changed = true; } return changed; }

canvas.addEventListener('click', e => {
  if (moved) return;
  const q = e.target.closest('[data-qadd]'); if (q){ e.stopPropagation(); addChild(byId[q.dataset.qadd]); return; }
  const t = e.target.closest('[data-tog]');
  if (t){ const p = byId[t.dataset.tog]; setFold(p, !collapsed.has(p.o)); keepAnchor(p, renderTree); return; }
  const el = e.target.closest('.p');
  if (el){ const p = byId[el.dataset.id]; const a = anchor(p); if (collapsed.has(a.o)) { collapsed.delete(a.o); keepAnchor(a, renderTree); } select(byId[el.dataset.id]); if (isMobile()) requestAnimationFrame(() => centerOn(byId[el.dataset.id])); }
});
// re-render while keeping a person's card in the same spot on screen
function keepAnchor(p, fn){
  const before = p.el ? p.el.getBoundingClientRect() : null; const id = p.id;
  fn();
  const np = byId[id];
  if (before && np && np.el){ const after = np.el.getBoundingClientRect(); tx += before.left - after.left; ty += before.top - after.top; apply(); }
}

// ---------------- pan & zoom ----------------
let s = 1, tx = 0, ty = 0, moved = false;
const apply = () => canvas.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
function zoomAt(f, cx, cy){ const ns = Math.min(2.5, Math.max(0.1, s * f)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }
vp.addEventListener('wheel', e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pts = new Map(); let last = null, pinch = null, downId = null;
vp.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; last = { x: e.clientX, y: e.clientY }; downId = e.pointerId; });
vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2){
    const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = vp.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch = d; moved = true; return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  if (!moved && Math.abs(dx) + Math.abs(dy) > 5){ moved = true; vp.classList.add('drag'); try { vp.setPointerCapture(e.pointerId); } catch(_){} }
  if (moved){ tx += dx; ty += dy; apply(); last = { x: e.clientX, y: e.clientY }; }
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; vp.classList.remove('drag'); setTimeout(() => moved = false, 0); };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
function fit(){
  s = 1; tx = 0; ty = 0; apply();
  const w = canvas.scrollWidth, h = canvas.scrollHeight;
  const vh = isMobile() ? Math.max(150, panel.getBoundingClientRect().top - vp.getBoundingClientRect().top) : vp.clientHeight;
  s = Math.max(0.1, Math.min(vp.clientWidth / w, vh / h, 1));
  tx = (vp.clientWidth - w * s) / 2; ty = Math.max(0, (vh - h * s) / 2); apply();
}
const isMobile = () => window.matchMedia('(max-width: 820px)').matches;
function centerOn(p, minScale){
  if (view !== 'tree' || !p || !p.el) return;
  if (!minScale && isMobile()) minScale = 0.6;
  if (minScale && s < minScale) s = minScale;
  apply();
  const r = p.el.getBoundingClientRect(), v = vp.getBoundingClientRect();
  const sheetTop = isMobile() ? panel.getBoundingClientRect().top : v.bottom;
  const visH = Math.max(120, Math.min(v.bottom, sheetTop) - v.top);
  tx += (v.left + v.width / 2) - (r.left + r.width / 2);
  ty += (v.top + visH / 2) - (r.top + r.height / 2);
  canvas.style.transition = 'transform .35s ease'; apply(); setTimeout(() => canvas.style.transition = '', 380);
}
$('#zin').onclick = () => zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2);
$('#zout').onclick = () => zoomAt(0.8, vp.clientWidth / 2, vp.clientHeight / 2);
$('#fit').onclick = fit;
$('#expand').onclick = () => { collapsed.clear(); renderTree(); fit(); };
$('#collapse').onclick = () => { defaultFold(); renderTree(); fit(); };

// ---------------- relationships ----------------
const G = (p, f, m, u) => { const g = typeof p === 'string' ? p : p.g; return g === 'f' ? f : g === 'm' ? m : u; };
const ord = n => ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth'][n] || n + 'th';
const greats = n => n <= 0 ? '' : (n === 1 ? 'great-' : n + '× great-');
const ancestry = p => { const a = []; for (let x = p; x; x = x.parent) a.push(x); return a; };
function bloodTerm(A, B, gx){
  const g = gx || A.g;
  if (A === B) return { t: 'self', path: [A] };
  const aa = ancestry(A), bb = ancestry(B), lca = aa.find(x => bb.includes(x));
  const da = aa.indexOf(lca), db = bb.indexOf(lca);
  let t;
  if (da === 0) t = db === 1 ? G(g, 'mother', 'father', 'parent') : greats(db - 2) + G(g, 'grandmother', 'grandfather', 'grandparent');
  else if (db === 0) t = da === 1 ? G(g, 'daughter', 'son', 'child') : greats(da - 2) + G(g, 'granddaughter', 'grandson', 'grandchild');
  else if (da === 1 && db === 1) t = G(g, 'sister', 'brother', 'sibling');
  else if (da === 1) t = greats(db - 2) + G(g, 'aunt', 'uncle', 'aunt/uncle');
  else if (db === 1) t = greats(da - 2) + G(g, 'niece', 'nephew', 'niece/nephew');
  else { const deg = Math.min(da, db) - 1, rem = Math.abs(da - db); t = ord(deg) + ' cousin' + (rem ? (rem === 1 ? ' once removed' : rem === 2 ? ' twice removed' : ` ${rem} times removed`) : ''); }
  const upP = []; for (let x = A; x !== lca; x = x.parent) upP.push(x);
  const dn = []; for (let x = B; x !== lca; x = x.parent) dn.push(x);
  return { t, path: [...upP, lca, ...dn.reverse()] };
}
function relationship(A, B){
  const who = x => `<b>${esc(x.name)}</b>`;
  if (A === B) return { text: 'That is the same person.', path: [A] };
  if (partnerOf(A) === B) return { text: `${who(A)} is ${who(B)}'s <b>${G(A, 'wife', 'husband', 'spouse')}</b>.`, path: [A, B] };
  const a = anchor(A), b = anchor(B), r = bloodTerm(a, b);
  let path = r.path; if (!A.blood) path = [A, ...path]; if (!B.blood) path = [...path, B];
  let text;
  const inlaw = t => t.replace(/^first cousin$/, 'cousin') + '-in-law';
  if (A.blood && B.blood) text = `${who(A)} is ${who(B)}'s <b>${r.t}</b>.`;
  else if (!A.blood && B.blood) text = `${who(A)} is ${who(B)}'s <b>${inlaw(bloodTerm(a, b, A.g).t)}</b> (the ${G(A, 'wife', 'husband', 'partner')} of ${who(a)}, ${esc(B.name)}'s ${r.t}).`;
  else if (A.blood && !B.blood) text = `${who(A)} is ${who(B)}'s <b>${inlaw(r.t)}</b> (${esc(A.name)} is the ${r.t} of ${who(b)}, ${esc(B.name)}'s ${G(B, 'husband', 'wife', 'partner')}).`;
  else text = `${who(A)} is married to ${who(a)}, and ${who(B)} is married to ${who(b)}. ${esc(a.name)} is ${esc(b.name)}'s <b>${r.t}</b>.`;
  return { text, path };
}

// ---------------- panel ----------------
const panel = $('#panel');
const chip = p => `<span class="chip ${p.g}${p.late ? ' late' : ''}" data-id="${p.id}" title="${esc(label(p))}">${av(p)}${esc(p.name)}${p.late ? ' ✝' : ''}</span>`;
const group = (title, list, empty) => `<h3>${title}</h3>` + (list.length ? `<div class="chips">${list.map(chip).join('')}</div>` : `<div class="none">${empty || 'None recorded'}</div>`);
const handle = '<button class="handle" data-act="sheet" aria-label="Expand or shrink panel"></button>';

function stats(){
  const gens = Math.max(...people.map(p => p.gen));
  return { n: people.length, gens, living: people.filter(p => !p.late).length };
}
function renderWelcome(){
  const st = stats();
  panel.innerHTML = `${handle}<div class="welcome">
    <h2>Welcome 👋</h2>
    <p>The family of <b>${esc(root.name)}${root.partner ? ' &amp; ' + esc(root.partner.name) : ''}</b> and their descendants.</p>
    <div class="stats"><div><b>${st.n}</b><span>people</span></div><div><b>${st.gens}</b><span>generations</span></div><div><b>${st.living}</b><span>living*</span></div></div>
    <ul>
      <li><b>Tap any person</b> to see their parents, partner, brothers &amp; sisters and children. Tap those names to keep exploring.</li>
      <li>Branches with a <b>+</b> are folded. Tap the person to open them.</li>
      <li>Try <b>List</b> view for a simple outline you can print.</li>
      <li>To add or remove people, press <b>✎ Edit family</b>.</li>
    </ul>
    <p style="font-size:.75rem;color:var(--muted)">* not marked as late on the chart</p>
    <button class="primary" data-id="${root.id}">Start with ${esc(root.name)}</button></div>`;
  panel.classList.toggle('min', isMobile());
}
function renderPanel(){
  if (!current){ renderWelcome(); return; }
  const p = current, a = anchor(p);
  const partner = partnerOf(p);
  const status = [G(p, 'Female', 'Male', 'Gender not recorded'), p.late ? 'Late ✝' : null, years(p.o) || null, `Generation ${p.gen}`, p.blood ? null : 'Married into the family'].filter(Boolean).join(' · ');
  const gc = p.children.flatMap(c => c.children);
  const line = ancestry(a).reverse();
  const lineage = line.map(x => `<a data-id="${x.id}">${esc(first(x.name))}</a>`).join(' → ') + (p.blood ? '' : ` ⚭ <a data-id="${p.id}">${esc(first(p.name))}</a>`);
  const sibs = siblingsOf(a);
  const idx = a.parent ? a.parent.children.indexOf(a) : -1;
  const acts = editMode ? `<div class="acts">
      <button class="primary" data-act="child">＋ Add child</button>
      ${p.blood && !p.partner ? `<button data-act="partner">＋ Add partner</button>` : `<button data-act="edit">✎ Edit details</button>`}
      ${p.blood && !p.partner ? `<button data-act="edit" class="full">✎ Edit details</button>` : ''}
      ${p.blood && p.parent ? `<button data-act="left" ${idx <= 0 ? 'disabled' : ''} title="Move earlier in birth order">◀ Move left</button><button data-act="right" ${idx >= sibs.length ? 'disabled' : ''} title="Move later in birth order">Move right ▶</button>` : ''}
      ${p === root ? `<button data-act="parent" class="full">＋ Add a parent above ${esc(first(p.name))}</button>` : ''}
      <button data-act="remove" class="danger full">🗑 Remove ${esc(first(p.name))}</button>
      <p class="hint">Children are added to ${esc(a.name)}${a.partner ? ' &amp; ' + esc(a.partner.name) : ''}.</p>
    </div>` : '';
  panel.innerHTML = `${handle}
    <div class="nav"><button data-act="back" ${visited.length ? '' : 'disabled'}>← Back</button><button data-act="home">⌂ Home</button><button data-act="locate">◎ Show on tree</button></div>
    <div class="prof">${av(p).replace('class="av', 'class="av big')}<div><h2>${esc(p.name)}</h2><div class="sub">${esc(status)}</div></div></div>
    ${p.o.notes ? `<div class="notes">${esc(p.o.notes)}</div>` : ''}
    ${acts}
    ${p.blood ? group('Parents', parentsOf(p)) : group('Parents', [], 'Not on this tree (married into the family)')}
    ${group(G(p, 'Husband', 'Wife', 'Partner'), partner ? [partner] : [])}
    ${p.blood ? group('Brothers &amp; sisters', sibs) : group('Brothers &amp; sisters-in-law', sibs)}
    ${group('Children', p.children)}
    ${gc.length ? group('Grandchildren', gc) : ''}
    <h3>Line of descent</h3><div class="lineage">${lineage}</div>
    <div class="rel"><b>How are we related?</b>
      <select id="cmp"><option value="">Choose another person…</option>${[...people].sort((x, y) => x.name.localeCompare(y.name)).filter(x => x !== p).map(x => `<option value="${x.id}" ${compareWith === x ? 'selected' : ''}>${esc(label(x))}</option>`).join('')}</select>
      <div class="answer" id="answer"></div>
    </div>
    ${visited.length ? `<div class="crumbs">Recently viewed: ${visited.slice(-6).reverse().map(h => `<a data-id="${h.id}">${esc(first(h.name))}</a>`).join(' · ')}</div>` : ''}`;
  const cmp = $('#cmp');
  cmp.onchange = () => { compareWith = cmp.value ? byId[cmp.value] : null; showRel(); };
  showRel();
}
function showRel(){
  const out = $('#answer'); if (!out) return;
  markSelection();
  if (!compareWith){ out.innerHTML = ''; return; }
  const r = relationship(current, compareWith), back = relationship(compareWith, current);
  out.innerHTML = r.text + `<div style="color:var(--muted);font-size:.86rem;margin-top:6px">${back.text}</div>` +
    `<div class="lineage" style="margin-top:6px">Path: ${r.path.map(x => `<a data-id="${x.id}">${esc(first(x.name))}</a>`).join(' → ')}</div>`;
}
function select(p, opts){
  opts = opts || {};
  if (!opts.fromHistory && current && current !== p){ visited = visited.filter(v => v !== current); visited.push(current); if (visited.length > 30) visited.shift(); }
  current = p; selObj = p ? p.o : null; selId = p ? p.id : null;
  if (compareWith === p) compareWith = null;
  renderPanel(); markSelection();
  panel.classList.remove('min'); panel.scrollTop = 0;
  if (view === 'list') highlightList();
  try { history.replaceState(null, '', p ? '#' + p.id : location.pathname + location.search); } catch(e){}
}
function goTo(p, minScale){
  if (!p) return;
  if (revealPath(p)) renderTree();
  select(p);
  if (view === 'tree') centerOn(p, minScale);
  else { openListTo(p); }
}
panel.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  if (actEl){ doAct(actEl.dataset.act); return; }
  const t = e.target.closest('[data-id]');
  if (t) goTo(byId[t.dataset.id]);
});
function doAct(act){
  const p = current;
  switch (act){
    case 'sheet': panel.classList.toggle('min'); return;
    case 'back': { const h = visited.pop(); if (h){ if (revealPath(h)) renderTree(); select(h, { fromHistory: true }); centerOn(h); } return; }
    case 'home': visited = []; compareWith = null; current = null; selObj = null; defaultFold(); renderTree(); renderWelcome(); fit(); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} return;
    case 'locate': if (view !== 'tree') setView('tree'); if (revealPath(p)) renderTree(); centerOn(p, 0.8); return;
    case 'child': addChild(p); return;
    case 'partner': addPartner(p); return;
    case 'edit': editPerson(p); return;
    case 'remove': removePerson(p); return;
    case 'left': case 'right': movePerson(p, act === 'left' ? -1 : 1); return;
    case 'parent': addParent(p); return;
  }
}

// ---------------- editing ----------------
function refresh(){
  build();
  current = (selObj && people.find(x => x.o === selObj)) || (selId && byId[selId]) || null;
  selObj = current ? current.o : null;
  visited = visited.map(v => people.find(x => x.o === v.o)).filter(Boolean);
  if (compareWith) compareWith = people.find(x => x.o === compareWith.o) || null;
  renderTree(); renderList(); renderPanel(); renderSubtitle(); renderNotice();
  $('#undoBtn').disabled = !undoStack.length;
}
function change(desc, fn, after){
  undoStack.push(JSON.stringify(data)); if (undoStack.length > 60) undoStack.shift();
  fn(); save(); refresh(); if (after) after();
  toast(desc, true);
}
function undo(){
  const st = undoStack.pop(); if (!st){ toast('Nothing to undo'); return; }
  data = JSON.parse(st);
  if (JSON.stringify(data) === ORIGINAL_STR) clearSaved(); else save();
  refresh(); toast('Change undone');
}
function cleanPerson(v){
  const o = { name: v.name.trim().replace(/\s+/g, ' ') };
  o.g = v.g || 'u';
  if (v.born) o.born = v.born.trim();
  if (v.died) o.died = v.died.trim();
  if (v.late || v.died) o.late = true;
  if (v.notes && v.notes.trim()) o.notes = v.notes.trim();
  return o;
}
function openForm(title, lead, values){
  return new Promise(resolve => {
    const dlg = $('#formDlg'), f = $('#form');
    $('#formTitle').textContent = title; $('#formLead').textContent = lead || ''; $('#formLead').hidden = !lead;
    f.reset();
    f.name.value = values.name || ''; f.born.value = values.born || ''; f.died.value = values.died || '';
    f.notes.value = values.notes || ''; f.late.checked = !!values.late;
    [...f.querySelectorAll('input[name=g]')].forEach(r => r.checked = r.value === (values.g || 'u'));
    f.died.oninput = () => { if (f.died.value.trim()) f.late.checked = true; };
    dlg.returnValue = '';
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok' || !f.name.value.trim()) return resolve(null);
      resolve({ name: f.name.value, g: (f.querySelector('input[name=g]:checked') || {}).value, born: f.born.value, died: f.died.value, late: f.late.checked, notes: f.notes.value });
    };
    f.name.placeholder = values.example || 'Full name';
    dlg.showModal();
    f.name.focus();
  });
}
function ask(title, bodyHtml, buttons){
  return new Promise(resolve => {
    const dlg = $('#msgDlg');
    $('#msgTitle').textContent = title; $('#msgBody').innerHTML = bodyHtml;
    const box = $('#msgBtns'); box.className = buttons.length > 2 ? 'col' : 'row';
    box.innerHTML = buttons.map(b => `<button value="${b.value}" class="${b.cls || ''}">${b.label}</button>`).join('');
    dlg.returnValue = '';
    dlg.onclose = () => resolve(dlg.returnValue || null);
    dlg.showModal();
  });
}
const surname = p => { const w = anchor(p).name.trim().split(/\s+/); return w.length > 1 ? w[w.length - 1] : ''; };
async function addChild(p){
  if (!p) return;
  const a = anchor(p);
  const parents = a.name + (a.partner ? ' & ' + a.partner.name : '');
  const v = await openForm(`Add a child`, `Child of ${parents}`, { g: 'u', example: 'e.g. Lindiwe ' + (surname(p) || 'Tlou') });
  if (!v) return;
  const o = cleanPerson(v);
  change(`Added ${o.name} as a child of ${first(a.name)}`, () => { (a.o.children = a.o.children || []).push(o); collapsed.delete(a.o); },
    () => { const np = people.find(x => x.o === o); if (np){ select(np); centerOn(np); np.el && np.el.classList.add('hit'); } });
}
async function addPartner(p){
  if (!p || !p.blood || p.o.spouse) return;
  const v = await openForm(`Add ${first(p.name)}'s partner`, 'Husband or wife who married into the family', { g: p.g === 'f' ? 'm' : p.g === 'm' ? 'f' : 'u', example: 'e.g. Thandiwe Mabena' });
  if (!v) return;
  const o = cleanPerson(v);
  change(`Added ${o.name} as ${first(p.name)}'s partner`, () => { p.o.spouse = o; }, () => { const np = people.find(x => x.o === o); if (np){ select(np); centerOn(np); } });
}
async function editPerson(p){
  if (!p) return;
  const v = await openForm(`Edit ${p.name}`, '', p.o);
  if (!v) return;
  const o = cleanPerson(v);
  change(`Saved changes to ${o.name}`, () => {
    ['name', 'g', 'born', 'died', 'late', 'notes'].forEach(k => { if (o[k] === undefined) delete p.o[k]; else p.o[k] = o[k]; });
    if (!v.late && !v.died) delete p.o.late;
  });
}
async function addParent(p){
  if (p !== root) return;
  const v = await openForm(`Add a parent of ${first(p.name)}`, `This person becomes the new top of the tree. You can add their partner afterwards.`, { g: 'u', example: 'e.g. Mosimanegape ' + (surname(p) || 'Tlou') });
  if (!v) return;
  const o = cleanPerson(v);
  change(`Added ${o.name} above ${first(p.name)}`, () => { o.children = [data]; data = o; }, () => { selObj = o; const np = people.find(x => x.o === o); if (np){ select(np); centerOn(np); } });
}
function movePerson(p, dir){
  if (!p || !p.blood || !p.parent) return;
  const arr = p.parent.o.children, i = arr.indexOf(p.o), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  change(`Moved ${first(p.name)} ${dir < 0 ? 'left' : 'right'}`, () => { [arr[i], arr[j]] = [arr[j], arr[i]]; }, () => current && centerOn(current));
}
async function removePerson(p){
  if (!p) return;
  if (!p.blood){
    const r = await ask(`Remove ${p.name}?`, `<p>${esc(p.name)} will be removed as ${esc(p.partnerOf.name)}'s partner. Their children stay in the tree under ${esc(p.partnerOf.name)}.</p>`,
      [{ label: 'Cancel', value: 'no' }, { label: '🗑 Remove', value: 'yes', cls: 'danger' }]);
    if (r !== 'yes') return;
    const keep = p.partnerOf.o;
    change(`Removed ${p.name}`, () => { delete keep.spouse; }, () => { const np = people.find(x => x.o === keep); np ? select(np) : select(null); });
    return;
  }
  if (p === root){
    if (p.children.length === 1){
      const r = await ask(`Remove ${p.name}?`, `<p>${esc(p.name)} is at the top of the tree${p.partner ? ` with ${esc(p.partner.name)}` : ''}. Removing them makes <b>${esc(p.children[0].name)}</b> the new top of the tree.</p>`,
        [{ label: 'Cancel', value: 'no' }, { label: '🗑 Remove', value: 'yes', cls: 'danger' }]);
      if (r !== 'yes') return;
      const nr = p.children[0].o;
      change(`Removed ${p.name}`, () => { data = nr; }, () => select(null));
    } else {
      await ask('This person can’t be removed', `<p>${esc(p.name)} is at the top of the tree and has ${p.children.length} children, so removing them would split the family into separate trees.</p><p>You can <b>edit</b> their details instead.</p>`, [{ label: 'OK', value: 'ok', cls: 'primary' }]);
    }
    return;
  }
  const n = descendants(p), parent = p.parent;
  const withPartner = p.partner ? ` and their partner ${esc(p.partner.name)}` : '';
  let mode;
  if (!n){
    mode = await ask(`Remove ${p.name}?`, `<p>This removes ${esc(p.name)}${withPartner} from the tree. You can undo straight after.</p>`,
      [{ label: 'Cancel', value: 'no' }, { label: '🗑 Remove', value: 'all', cls: 'danger' }]);
  } else {
    mode = await ask(`Remove ${p.name}?`, `<p>${esc(p.name)} has <b>${n}</b> ${n === 1 ? 'descendant' : 'descendants'} in the tree. What should happen to them?</p>`,
      [{ label: `Keep ${p.children.length === 1 ? 'their child' : 'their children'}: move ${p.children.length === 1 ? 'them' : 'them'} up under ${esc(first(parent.name))}`, value: 'keep' },
       { label: `🗑 Remove ${esc(first(p.name))} and all ${n} ${n === 1 ? 'descendant' : 'descendants'}`, value: 'all', cls: 'danger' },
       { label: 'Cancel', value: 'no' }]);
  }
  if (mode !== 'all' && mode !== 'keep') return;
  const arr = parent.o.children, i = arr.indexOf(p.o), pObj = parent.o;
  change(`Removed ${p.name}${mode === 'all' && n ? ` and ${n} ${n === 1 ? 'descendant' : 'descendants'}` : ''}`, () => {
    if (mode === 'keep') arr.splice(i, 1, ...(p.o.children || [])); else arr.splice(i, 1);
  }, () => { const np = people.find(x => x.o === pObj); np ? select(np) : select(null); if (np) centerOn(np); });
}

// ---------------- export / import ----------------
function download(name, text, type){
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function buildHtml(){
  const json = JSON.stringify(data, null, 1).replace(/</g, '\\u003c');
  return PRISTINE.replace(/(<script id="family-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + '\n' + json + '\n' + b);
}
async function downloadSite(){
  download('index.html', buildHtml(), 'text/html');
  await ask('Updated website downloaded ✔', `<p>A new <b>index.html</b> with your changes is in your Downloads folder.</p>
    <p><b>To update the website for the whole family:</b></p>
    <ol class="steps">
      <li>Open your repository on <b>github.com</b>.</li>
      <li>Click <b>Add file → Upload files</b>.</li>
      <li>Drag in the downloaded <b>index.html</b>. It replaces the old one.</li>
      <li>Click <b>Commit changes</b>. The site updates in about a minute.</li>
    </ol>
    <p style="color:var(--muted);font-size:.85rem">Until you upload it, the changes only show on this device.</p>`, [{ label: 'Got it', value: 'ok', cls: 'primary' }]);
}
async function moreMenu(){
  const r = await ask('More options', '<p class="lead">Backups let you keep a copy of your edits, or move them to another device.</p>', [
    { label: '💾 Save a backup file (.json)', value: 'backup' },
    { label: '📂 Load a backup file', value: 'import' },
    { label: '↺ Discard all my changes (back to the published tree)', value: 'reset', cls: 'danger' },
    { label: 'Close', value: 'no' }]);
  if (r === 'backup') download(`family-tree-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 1), 'application/json');
  if (r === 'import') $('#importFile').click();
  if (r === 'reset') resetAll();
}
async function resetAll(){
  const r = await ask('Discard all changes?', '<p>This removes every change saved on this device and shows the tree as published.</p>', [{ label: 'Cancel', value: 'no' }, { label: 'Discard changes', value: 'yes', cls: 'danger' }]);
  if (r !== 'yes') return;
  change('Changes discarded', () => { data = JSON.parse(ORIGINAL_STR); }, () => { clearSaved(); renderNotice(); });
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || typeof obj.name !== 'string') throw new Error('not a family tree');
    change('Backup loaded', () => { data = obj; selObj = null; selId = null; }, () => { select(null); fit(); });
  } catch(err){ ask('Could not load that file', `<p>That file doesn't look like a family tree backup.</p>`, [{ label: 'OK', value: 'ok', cls: 'primary' }]); }
});

// ---------------- list view ----------------
const outline = $('#outline');
function nmchip(p){ const y = years(p.o); return `<span class="nmchip${p.late ? ' late' : ''}" data-id="${p.id}">${av(p)}${esc(p.name)}${p.late ? ' ✝' : ''}</span>${y ? `<span class="yr">${esc(y)}</span>` : ''}`; }
function listItem(p){
  const sp = p.partner ? `<span class="sp">⚭ ${nmchip(p.partner)}</span>` : '';
  if (!p.children.length) return `<div class="leaf" data-row="${p.id}">${nmchip(p)} ${sp}</div>`;
  const n = p.children.length;
  return `<details data-row="${p.id}" ${p.gen < 3 ? 'open' : ''}><summary>${nmchip(p)} ${sp} <span class="cnt">· ${n} ${n === 1 ? 'child' : 'children'}</span></summary>${p.children.map(listItem).join('')}</details>`;
}
function renderList(){ outline.innerHTML = listItem(root); highlightList(); }
function highlightList(){
  outline.querySelectorAll('.nmchip').forEach(e => e.style.background = '');
  if (current){ const el = outline.querySelector(`.nmchip[data-id="${current.id}"]`); if (el){ el.style.background = '#f3e3d6'; el.style.borderRadius = '999px'; } }
}
function openListTo(p){
  for (let a = anchor(p); a; a = a.parent){ const d = outline.querySelector(`details[data-row="${a.id}"]`); if (d && a !== anchor(p)) d.open = true; }
  const el = outline.querySelector(`.nmchip[data-id="${p.id}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
outline.addEventListener('click', e => {
  const t = e.target.closest('.nmchip'); if (!t) return;
  e.preventDefault(); select(byId[t.dataset.id]);
});
$('#openAll').onclick = () => outline.querySelectorAll('details').forEach(d => d.open = true);
$('#closeAll').onclick = () => outline.querySelectorAll('details').forEach((d, i) => d.open = i === 0);
$('#printBtn').onclick = () => { outline.querySelectorAll('details').forEach(d => d.open = true); window.print(); };

function setView(v){
  view = v;
  $('#treeView').hidden = v !== 'tree'; $('#listView').hidden = v !== 'list';
  $('#vTree').classList.toggle('on', v === 'tree'); $('#vList').classList.toggle('on', v === 'list');
  if (v === 'tree' && current) requestAnimationFrame(() => centerOn(current));
  if (v === 'list' && current) openListTo(current);
}
$('#vTree').onclick = () => setView('tree');
$('#vList').onclick = () => setView('list');

// ---------------- search ----------------
const q = $('#search'), res = $('#results');
let hits = [], act = 0;
function drawResults(){
  res.hidden = !hits.length && !q.value.trim();
  res.innerHTML = hits.length ? hits.map((p, i) => `<div class="${i === act ? 'act' : ''}" data-id="${p.id}">${av(p)}<span>${esc(p.name)}${p.late ? ' ✝' : ''} <small>${nameCount[p.name] > 1 || !p.blood ? esc(hint(p)) : ''}</small></span></div>`).join('')
    : `<div style="color:var(--muted);cursor:default">No one called “${esc(q.value.trim())}” yet</div>`;
}
q.addEventListener('input', () => { const v = q.value.trim().toLowerCase(); hits = v ? people.filter(p => p.name.toLowerCase().includes(v)).sort((a, b) => a.name.toLowerCase().indexOf(v) - b.name.toLowerCase().indexOf(v) || a.name.localeCompare(b.name)).slice(0, 15) : []; act = 0; drawResults(); if (!v) res.hidden = true; });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ act = Math.min(act + 1, hits.length - 1); drawResults(); e.preventDefault(); }
  if (e.key === 'ArrowUp'){ act = Math.max(act - 1, 0); drawResults(); e.preventDefault(); }
  if (e.key === 'Enter' && hits[act]) pick(hits[act]);
  if (e.key === 'Escape'){ q.value = ''; hits = []; res.hidden = true; }
});
res.addEventListener('mousedown', e => e.preventDefault());
res.addEventListener('click', e => { const t = e.target.closest('[data-id]'); if (t) pick(byId[t.dataset.id]); });
q.addEventListener('blur', () => setTimeout(() => res.hidden = true, 150));
function pick(p){ hits = []; res.hidden = true; q.value = ''; q.blur(); goTo(p, 0.8); if (p.el){ p.el.classList.remove('hit'); void p.el.offsetWidth; p.el.classList.add('hit'); } }

// ---------------- edit mode, notices, help ----------------
function setEdit(on){
  editMode = on; document.body.classList.toggle('editing', on);
  $('#editbar').hidden = !on; $('#editBtn').hidden = on;
  renderPanel(); renderNotice();
  if (on && !current) toast('Click a person to add, edit or remove family members');
}
$('#editBtn').onclick = () => setEdit(true);
$('#doneBtn').onclick = () => setEdit(false);
$('#undoBtn').onclick = undo;
$('#downloadBtn').onclick = downloadSite;
$('#moreBtn').onclick = moreMenu;
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && editMode && !e.target.closest('input,textarea')){ e.preventDefault(); undo(); }
  if (e.key === '/' && !e.target.closest('input,textarea')){ e.preventDefault(); q.focus(); }
});
function renderSubtitle(){
  const st = stats();
  $('#subtitle').textContent = `${st.n} people · ${st.gens} generations · descendants of ${root.name}${root.partner ? ' & ' + root.partner.name : ''}`;
}
function renderNotice(){
  const n = $('#notice');
  if (staleSaved){
    n.hidden = false;
    n.innerHTML = `<span>📝 This device has unsaved edits from an older version of the tree (${new Date(staleSaved.savedAt).toLocaleDateString()}).</span><button data-n="restore">Restore my edits</button><button data-n="dismiss" class="ghost">Dismiss</button>`;
  } else if (hasLocalChanges() && !editMode){
    n.hidden = false;
    n.innerHTML = `<span>📝 You're seeing changes saved on this device that aren't on the website yet.</span><button data-n="edit">Review / download</button>`;
  } else n.hidden = true;
}
$('#notice').addEventListener('click', e => {
  const b = e.target.closest('[data-n]'); if (!b) return;
  if (b.dataset.n === 'restore'){ const st = staleSaved; staleSaved = null; change('Your edits were restored', () => { data = st.data; }); }
  if (b.dataset.n === 'dismiss'){ staleSaved = null; clearSaved(); renderNotice(); }
  if (b.dataset.n === 'edit') setEdit(true);
});
$('#helpBtn').onclick = () => ask('How to use the family tree', `<div class="help">
  <h4>Exploring</h4>
  <ul><li>Tap a person to see their parents, partner, brothers &amp; sisters and children. Tap any of those names to keep going. <b>← Back</b> returns to the last person.</li>
  <li>Drag to move around. Scroll or pinch to zoom. <b>⤢</b> shows the whole tree.</li>
  <li><b>How are we related?</b> (in the side panel) names the relationship between two people.</li>
  <li><b>List</b> view shows everyone as a simple outline you can print.</li></ul>
  <h4>Adding &amp; removing people</h4>
  <ul><li>Press <b>✎ Edit family</b>, tap a person, then use the yellow buttons: <b>Add child</b>, <b>Add partner</b>, <b>Edit details</b>, <b>Move left/right</b> (birth order), <b>Remove</b>.</li>
  <li>In edit mode, each card also has a small <b>＋</b> for adding a child quickly.</li>
  <li>Made a mistake? Press <b>↶ Undo</b> (or Ctrl+Z).</li></ul>
  <h4>Sharing your changes</h4>
  <p>Changes are saved on your device straight away. To update the website for everyone, press <b>⬇ Download updated website</b> and upload the file to GitHub (the steps are shown after downloading).</p></div>`,
  [{ label: 'Close', value: 'ok', cls: 'primary' }]);

let toastTimer;
function toast(msg, withUndo){
  $('#toastMsg').textContent = msg; $('#toastUndo').hidden = !withUndo;
  $('#toast').classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), withUndo ? 6000 : 3000);
}
$('#toastUndo').onclick = () => { $('#toast').classList.remove('show'); undo(); };

// ---------------- start ----------------
build(); defaultFold(); renderTree(); renderList(); renderSubtitle(); renderNotice(); renderWelcome();
requestAnimationFrame(() => {
  fit();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && byId[h]) goTo(byId[h], 0.8);
});
})();
</script>
</body>
</html>
